model_name: da
torch_compile: false
torch_compile_mode: default
da3_model: depth-anything/DA3NESTED-GIANT-LARGE-1.1
conf_thresh_percentile: 25 # per frame, drop depth pixels at or below this confidence percentile
save_per_frame_local_pointclouds: true # recon/<name>/pts_local*/
save_graph_debug_artifacts: true # graph submaps/, matches/ and frame images, needed to resume from this run (prev_slam_folder)
pointcloud_format: ply # pts_global / per-frame clouds: ply (binary, no size limit) | pcd (LZF-compressed PCD, capped at ~1.3e8 points)
submap_scale_solver: gtsam # or numpy: same objective and LM schedule, vectorized (scales agree to ~1e-14, ~15x faster)
frame_scale_solver: gtsam # or numpy, same as above for the per-frame scales

use_slam: true
is_mono: false
trajectory: ov
slam_trajectory_topic: /ov_slam/trajectory
slam_final_trajectory_topic: /ov_slam/trajectory_final
slam_odometry_topic: /ov_slam/odometry
slam_image_topic: /ov_slam/image/compressed
image_pose_timestamp_tolerance_sec: 0.005

frame_scale_opt: true
submap_scale_opt: true
point_cloud_fusion: true

select_kf_on_time: true
sec_skip: 0.32

kf_distance: 0.3
kf_distance_large: 1.0     # use 1.0 if data contains large open spaces (outdoor)
kf_angle_deg: 10
max_distance: 0            # use 0 for adaptive max range filtering
num_ref_poses_per_batch: 6
num_ref_poses_per_submap: 6
overlap_ref_views: 1

publish_ros2_pointcloud: false
publish_ros2_path: false
publish_ros2_images: false

# To be filled
pinhole_intrinsics: [0, 0, 0, 0]
pinhole_resolution: [0, 0]
